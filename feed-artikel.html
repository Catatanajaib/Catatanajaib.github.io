<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita & Feed Artikel</title>
  <base href="../">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/beranda.css">
  <link rel="stylesheet" href="css/postingan.css">
  <script src="Javascript/common.js" defer></script>
  <script src="Javascript/beranda.js" defer></script>
  <script src="Javascript/postingan.js" defer></script>
  <script src="Javascript/nav-bar.js" defer></script>

  <style>
    /* Container Utama Artikel */
    .post-body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: #333333;
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
      text-align:left;
    }

    /* Pengaturan Judul Sub-Topik */
    .post-body h2 {
      font-size: 24px;
      color: #1a252f;
      margin-top: 25px;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }

    .post-body h3 {
      font-size: 19px;
      color: #2c3e50;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    /* Pengaturan Paragraf */
    .post-body p {
      margin-bottom: 16px;
      text-align: justify;
    }

    /* Galeri Gambar */
    .galeri-desain {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    /* Kartu Gambar & Efek Hover/Zoom */
    .konten-zoom {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }

    .konten-zoom:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .konten-zoom img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .konten-zoom p {
      font-size: 14px;
      font-weight: 600;
      color: #555555;
      padding: 8px;
      margin: 0;
      text-align: center;
      background-color: #f8fafc;
    }

    /* Area Statistik Jumlah Like & Komentar */
    .post-stats {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #65676b;
      padding: 10px 5px;
      border-bottom: 1px solid #e4e6eb;
      margin-top: 20px;
    }

    /* Container Tombol Interaksi */
    .post-actions {
      display: flex;
      justify-content: space-around;
      padding: 6px 0;
      border-bottom: 1px solid #e4e6eb;
    }

    /* Desain Dasar Tombol */
    .action-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 8px;
      border-radius: 6px;
      font-weight: 600;
      color: #65676b;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn:hover { background-color: #f2f2f2; }
    .action-btn:active { transform: scale(0.95); }
    .action-btn.active { color: #0866ff; }
    .action-btn.active .btn-icon { animation: bounce 0.3s ease; }

    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    } 

    /* Indikator Pemicu Infinite Scroll */
    #scroll-sentinel {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style> 
</head>

<body>
  <nav-bar></nav-bar>

  <article class="post-card">
    <header class="post-header">
      <img src="gambar/IMG_20251213_171056.jpg" alt="Foto Profil" class="avatar">
      <div class="user-info">
        <h4>Miftahul Mujib</h4>
        <span>2 jam yang lalu &bull; Publik</span>
      </div>
    </header>

    <!-- Diubah dari <article> ke <div> agar struktur HTML valid -->
    <div class="post-body">
      <h2>Inspirasi Desain Rumah Simpel, Sederhana, dan Tetap Mempesona</h2>
      <p>Berikut beberapa desain menarik rumah yang simpel,... <a href="html/artikel.html">baca lebih lengkap</a></p>
      
      <div class="konten-zoom">
        <img src="https://picsum.photos/600/300?random=1" alt="Foto Postingan 1" />
      </div>

      <!-- Area Statistik Like & Komen -->
      <div class="post-stats">
        <span>👍 <strong id="like-count">128000000</strong> Suka</span>
        <span><strong id="comment-count">904rb</strong> Komentar</span>
      </div>

      <!-- Tombol Aksi (Like, Komen, Share) -->
      <footer class="post-actions">
        <button class="action-btn" id="btn-like" onclick="toggleLike()">
          <span class="btn-icon">👍</span>
          <span id="btn-like-text">Suka</span>
        </button>

        <button class="action-btn" onclick="scrollToComments()">💬 Komentar</button>
        <button class="action-btn" onclick="sharePost()">↗️ Bagikan</button>
      </footer>
    </div>
  </article>

  <!-- Iklan / Banner Tambahan -->
  <div class="konten-zoom" style="max-width: 800px; margin: 20px auto;">
    <script>
      atOptions = {
        'key' : 'c7ceecf9be42bb2b182175415809298d',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/c7ceecf9be42bb2b182175415809298d/invoke.js"></script>
  </div>

  <!-- Wadah untuk memuat postingan tambahan via JS -->
  <div id="posts-container"></div>

  <!-- Elemen pemicu (sentinel) untuk Infinite Scroll -->
  <div id="scroll-sentinel">Memuat postingan berikutnya...</div>

  <!-- Script tambahan -->
  <script>
    let isLiked = false;
    let rawLikes = 128000000;

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(0) + 'jt';
      if (num >= 1000) return (num / 1000).toFixed(0) + 'rb';
      return num;
    }

    document.addEventListener("DOMContentLoaded", function() {
      const likeElem = document.getElementById('like-count');
      if (likeElem) likeElem.innerText = formatNumber(rawLikes);
    });

    function toggleLike() {
      const likeBtn = document.getElementById('btn-like');
      const likeText = document.getElementById('btn-like-text');
      const likeCountElem = document.getElementById('like-count');

      if (!isLiked) {
        rawLikes++;
        likeBtn.classList.add('active');
        likeText.innerText = 'Disukai';
        isLiked = true;
      } else {
        rawLikes--;
        likeBtn.classList.remove('active');
        likeText.innerText = 'Suka';
        isLiked = false;
      }
      likeCountElem.innerText = formatNumber(rawLikes);
    }

    function scrollToComments() {
      const commentSection = document.getElementById('kolom-komentar');
      if (commentSection) {
        commentSection.scrollIntoView({ behavior: 'smooth' });
      } else {
        alert('Silakan tulis komentar Anda di bagian bawah artikel!');
      }
    }

    function sharePost() {
      if (navigator.share) {
        navigator.share({
          title: document.title,
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link artikel berhasil disalin!');
      }
    }
  </script>
</body>
</html>
