<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangkaian Paralel yang Benar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1e24;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #f39c12;
      text-align: center;
    }

    p.subtitle {
      margin-bottom: 20px;
      color: #bdc3c7;
      text-align: center;
      max-width: 600px;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      background-color: #2c3e50;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 750px;
    }

    svg {
      width: 100%;
      height: auto;
    }

    /* Kabel Merah (Fasa) & Biru (Netral) */
    .wire-red {
      stroke: #e74c3c;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wire-blue {
      stroke: #3498db;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wire-switched {
      stroke: #e67e22;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s;
    }

    /* Indikator Aliran Listrik saat ON */
    .circuit-on .wire-switched {
      stroke: #f1c40f;
      filter: drop-shadow(0 0 4px #f1c40f);
    }

    .circuit-on .wire-blue {
      filter: drop-shadow(0 0 2px #3498db);
    }

    /* Sakelar Interaktif */
    .switch-group {
      cursor: pointer;
    }

    .switch-base {
      fill: #ecf0f1;
      stroke: #7f8c8d;
      stroke-width: 2;
      rx: 6;
    }

    .switch-lever {
      stroke: #c0392b;
      stroke-width: 6;
      stroke-linecap: round;
      transition: transform 0.2s ease;
      transform-origin: 90px 220px;
    }

    .circuit-on .switch-lever {
      transform: rotate(-28deg);
      stroke: #27ae60;
    }

    /* Lampu */
    .socket {
      fill: #7f8c8d;
      stroke: #34495e;
      stroke-width: 2;
    }

    .bulb {
      fill: #7f8c8d;
      stroke: #bdc3c7;
      stroke-width: 2;
      transition: fill 0.3s, filter 0.3s;
    }

    .rays {
      stroke: #f1c40f;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .circuit-on .bulb {
      fill: #ffeb3b;
      stroke: #f39c12;
      filter: drop-shadow(0 0 15px #ffeb3b) drop-shadow(0 0 30px #f39c12);
    }

    .circuit-on .rays {
      opacity: 1;
    }

    .status-badge {
      margin-top: 20px;
      padding: 10px 20px;
      background: #34495e;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .legend {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      font-size: 13px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <h1>Rangkaian Paralel 3 Lampu (Skema Benar)</h1>
  <p class="subtitle">
    Sakelar dipasang <b>hanya pada kabel Fasa (Merah)</b>. Kabel Netral (Biru) langsung terhubung ke tiap lampu. Klik sakelar di bawah untuk menyalakan listrik!
  </p>

  <div class="container" id="circuit">
    <svg viewBox="0 0 700 360">
      <!-- Label Sumber Listrik -->
      <text x="20" y="45" fill="#e74c3c" font-size="12" font-weight="bold">Fasa (+) [AC]</text>
      <text x="20" y="315" fill="#3498db" font-size="12" font-weight="bold">Netral (-) [AC]</text>

      <!-- 1. KABEL FASA (MERAH) dari Sumber ke Sakelar -->
      <path class="wire-red" d="M 20 50 L 90 50 L 90 190" />

      <!-- 2. SAKELAR -->
      <g class="switch-group" onclick="toggleCircuit()">
        <rect class="switch-base" x="70" y="180" width="40" height="80" />
        <!-- Kontak Sakelar -->
        <circle cx="90" cy="220" r="4" fill="#2c3e50" />
        <circle cx="90" cy="195" r="4" fill="#2c3e50" />
        <!-- Tuas Sakelar -->
        <line class="switch-lever" x1="90" y1="220" x2="90" y2="190" />
        <text x="90" y="275" fill="#ecf0f1" font-size="10" text-anchor="middle">KLIK SAYA</text>
      </g>

      <!-- 3. KABEL TERHUBUNG SAKELAR (Keluar Sakelar menuju Lampu 1, 2, 3) -->
      <!-- Jalur Utama Atas -->
      <path class="wire-switched" d="M 90 195 L 90 80 L 600 80" />
      <!-- Cabang ke Lampu 1 -->
      <path class="wire-switched" d="M 250 80 L 250 150" />
      <!-- Cabang ke Lampu 2 -->
      <path class="wire-switched" d="M 420 80 L 420 150" />
      <!-- Cabang ke Lampu 3 -->
      <path class="wire-switched" d="M 600 80 L 600 150" />

      <!-- 4. KABEL NETRAL (BIRU) langsung dari Sumber ke Lampu 1, 2, 3 -->
      <!-- Jalur Utama Bawah -->
      <path class="wire-blue" d="M 20 310 L 600 310" />
      <!-- Cabang ke Lampu 1 -->
      <path class="wire-blue" d="M 250 310 L 250 230" />
      <!-- Cabang ke Lampu 2 -->
      <path class="wire-blue" d="M 420 310 L 420 230" />
      <!-- Cabang ke Lampu 3 -->
      <path class="wire-blue" d="M 600 310 L 600 230" />

      <!-- Titik Sambungan / Junction (Paralel) -->
      <circle cx="250" cy="80" r="4" fill="#e67e22" />
      <circle cx="420" cy="80" r="4" fill="#e67e22" />
      <circle cx="250" cy="310" r="4" fill="#3498db" />
      <circle cx="420" cy="310" r="4" fill="#3498db" />

      <!-- === LAMPU 1 === -->
      <g>
        <rect class="socket" x="240" y="150" width="20" height="15" rx="2" />
        <rect class="socket" x="240" y="215" width="20" height="15" rx="2" />
        <circle class="bulb" cx="250" cy="190" r="25" />
        <g class="rays">
          <line x1="215" y1="190" x2="205" y2="190" />
          <line x1="285" y1="190" x2="295" y2="190" />
          <line x1="225" y1="165" x2="215" y2="155" />
          <line x1="275" y1="165" x2="285" y2="155" />
        </g>
      </g>

      <!-- === LAMPU 2 === -->
      <g>
        <rect class="socket" x="410" y="150" width="20" height="15" rx="2" />
        <rect class="socket" x="410" y="215" width="20" height="15" rx="2" />
        <circle class="bulb" cx="420" cy="190" r="25" />
        <g class="rays">
          <line x1="385" y1="190" x2="375" y2="190" />
          <line x1="455" y1="190" x2="465" y2="190" />
          <line x1="395" y1="165" x2="385" y2="155" />
          <line x1="445" y1="165" x2="455" y2="155" />
        </g>
      </g>

      <!-- === LAMPU 3 === -->
      <g>
        <rect class="socket" x="590" y="150" width="20" height="15" rx="2" />
        <rect class="socket" x="590" y="215" width="20" height="15" rx="2" />
        <circle class="bulb" cx="600" cy="190" r="25" />
        <g class="rays">
          <line x1="565" y1="190" x2="555" y2="190" />
          <line x1="635" y1="190" x2="645" y2="190" />
          <line x1="575" y1="165" x2="565" y2="155" />
          <line x1="625" y1="165" x2="635" y2="155" />
        </g>
      </g>
    </svg>
  </div>

  <div class="status-badge" id="status">STATUS: SAKELAR TERBUKA (OFF)</div>

  <div class="legend">
    <div class="legend-item">
      <div class="color-box" style="background: #e74c3c;"></div> Fasa (Merah)
    </div>
    <div class="legend-item">
      <div class="color-box" style="background: #3498db;"></div> Netral (Biru)
    </div>
    <div class="legend-item">
      <div class="color-box" style="background: #e67e22;"></div> Kabel Terkontrol Sakelar
    </div>
  </div>

  <script>
    let isConnected = false;

    function toggleCircuit() {
      isConnected = !isConnected;
      const circuit = document.getElementById('circuit');
      const status = document.getElementById('status');

      if (isConnected) {
        circuit.classList.add('circuit-on');
        status.innerText = "STATUS: SAKELAR TERTUTUP (ON) - LAMPU MENYALA";
        status.style.color = "#2ecc71";
      } else {
        circuit.classList.remove('circuit-on');
        status.innerText = "STATUS: SAKELAR TERBUKA (OFF) - LAMPU MATI";
        status.style.color = "#fff";
      }
    }
  </script>
</body>
</html>
